<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-kit Cover Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            color: #ff6347;
            margin-bottom: 20px;
            text-align: center;
        }

        .preview {
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin: 20px 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            min-height: 60px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-generate {
            background: linear-gradient(135deg, #ff6347 0%, #ff8c69 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 99, 71, 0.4);
        }

        .btn-download {
            background: #4caf50;
            color: white;
        }

        .btn-download:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-download:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .info {
            background: #ffe6e1;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #ff6347;
            font-size: 14px;
            color: #666;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>D-kit カバー画像ジェネレーター</h1>

        <div class="info">
            <strong>📐 サイズ:</strong> 1920x960px（Figmaプラグイン推奨サイズ）
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="title">タイトル</label>
                <input type="text" id="title" value="D-kit" placeholder="プラグイン名">
            </div>

            <div class="control-group">
                <label for="subtitle">サブタイトル</label>
                <input type="text" id="subtitle" value="Transform designs with any design kit" placeholder="キャッチコピー">
            </div>

            <div class="control-group">
                <label for="description">説明文</label>
                <textarea id="description" placeholder="プラグインの簡単な説明">Instantly apply styles from design kits to your existing designs. Color, typography, effects - all automated.</textarea>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-generate" onclick="generateCover()">🎨 カバー画像を生成</button>
            <button class="btn-download" id="downloadBtn" onclick="downloadCover()" disabled>💾 ダウンロード (cover.png)</button>
        </div>

        <img id="preview" class="preview" style="display: none;" alt="Cover Preview">
    </div>

    <canvas id="canvas" width="1920" height="960"></canvas>

    <script>
        let generatedImage = null;

        function generateCover() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const width = 1920;
            const height = 960;

            // 背景グラデーション
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#ff6347');
            gradient.addColorStop(1, '#ff8c69');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 装飾的な円（背景）
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(width * 0.8, height * 0.3, 300, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(width * 0.2, height * 0.7, 200, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // タイトル
            const title = document.getElementById('title').value;
            ctx.fillStyle = 'white';
            ctx.font = 'bold 140px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(title, 120, 280);

            // サブタイトル
            const subtitle = document.getElementById('subtitle').value;
            ctx.font = '48px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fillText(subtitle, 120, 360);

            // 説明文
            const description = document.getElementById('description').value;
            ctx.font = '32px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';

            // テキストを複数行に分割
            const maxWidth = 1000;
            const words = description.split(' ');
            let line = '';
            let y = 450;

            for (let i = 0; i < words.length; i++) {
                const testLine = line + words[i] + ' ';
                const metrics = ctx.measureText(testLine);

                if (metrics.width > maxWidth && i > 0) {
                    ctx.fillText(line, 120, y);
                    line = words[i] + ' ';
                    y += 45;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 120, y);

            // ビジュアル要素（右側）
            drawVisualElements(ctx, width, height);

            // プレビュー表示
            const preview = document.getElementById('preview');
            generatedImage = canvas.toDataURL('image/png');
            preview.src = generatedImage;
            preview.style.display = 'block';

            // ダウンロードボタンを有効化
            document.getElementById('downloadBtn').disabled = false;

            // スクロール
            preview.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function drawVisualElements(ctx, width, height) {
            const startX = width * 0.6;
            const startY = height * 0.3;

            // ビフォー/アフター表現
            ctx.globalAlpha = 0.9;

            // Before (左側のボックス)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(startX - 50, startY, 280, 280);

            // Before ラベル
            ctx.fillStyle = 'white';
            ctx.font = 'bold 28px -apple-system, sans-serif';
            ctx.fillText('Before', startX - 30, startY - 20);

            // グレースケールのボックス（デザイン前）
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(startX - 20, startY + 40, 80, 80);
            ctx.fillRect(startX + 80, startY + 40, 80, 80);
            ctx.fillRect(startX - 20, startY + 140, 80, 80);
            ctx.fillRect(startX + 80, startY + 140, 80, 80);

            // 矢印
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startX + 260, startY + 140);
            ctx.lineTo(startX + 350, startY + 140);
            ctx.stroke();

            // 矢印の先端
            ctx.beginPath();
            ctx.moveTo(startX + 350, startY + 140);
            ctx.lineTo(startX + 330, startY + 125);
            ctx.moveTo(startX + 350, startY + 140);
            ctx.lineTo(startX + 330, startY + 155);
            ctx.stroke();

            // After (右側のボックス)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect(startX + 390, startY, 280, 280);

            // After ラベル
            ctx.fillStyle = 'white';
            ctx.font = 'bold 28px -apple-system, sans-serif';
            ctx.fillText('After', startX + 410, startY - 20);

            // カラフルなボックス（デザイン適用後）
            ctx.fillStyle = '#50E3C2';
            ctx.fillRect(startX + 420, startY + 40, 80, 80);
            ctx.fillStyle = '#ff6347';
            ctx.fillRect(startX + 520, startY + 40, 80, 80);
            ctx.fillStyle = '#FFE066';
            ctx.fillRect(startX + 420, startY + 140, 80, 80);
            ctx.fillStyle = '#B8A4F5';
            ctx.fillRect(startX + 520, startY + 140, 80, 80);

            ctx.globalAlpha = 1;

            // 機能バッジ
            const badges = ['Auto Apply', 'Non-Destructive', 'Fast'];
            let badgeY = height - 150;
            ctx.font = 'bold 24px -apple-system, sans-serif';

            badges.forEach((badge, index) => {
                const badgeX = 120 + (index * 220);

                // バッジ背景
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.beginPath();
                ctx.roundRect(badgeX, badgeY, 200, 50, 25);
                ctx.fill();

                // バッジテキスト
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText(badge, badgeX + 100, badgeY + 33);
            });

            ctx.textAlign = 'left';
        }

        function downloadCover() {
            if (!generatedImage) {
                alert('先にカバー画像を生成してください');
                return;
            }

            const link = document.createElement('a');
            link.download = 'cover.png';
            link.href = generatedImage;
            link.click();
        }

        // ページ読み込み時に自動生成
        window.onload = function() {
            setTimeout(generateCover, 500);
        };
    </script>
</body>
</html>
